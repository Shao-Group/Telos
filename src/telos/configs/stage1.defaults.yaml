stage1:
  training:
    # Train on primary autosomes in this inclusive range (chr1-10 style).
    # All other contigs (remaining autosomes, X/Y/MT, scaffolds) are validation.
    site_label_tolerance_bp: 50
    split_policy: chr1-10
    random_state: 42
    random_forest:
      n_estimators: 300
      max_depth: null
      max_features: sqrt
      n_jobs: -1
      class_weight: balanced_subsample
    xgboost:
      n_estimators: 300
      max_depth: 6
      learning_rate: 0.1
      subsample: 0.8
      colsample_bytree: 0.8
      reg_lambda: 3
      reg_alpha: 0.5
      n_jobs: -1
    lightgbm:
      n_jobs: -1
  feature_extraction:
    window_size: 100
    density_window: 100
    coverage_window: 100
    soft_clip_window: 10
    min_mapq: 10
    splice_site_window: 300
    gradient_analysis_range: 100
    extended_window: 1000
    # null = no on-disk feature cache. Set a path or TELOS_STAGE1_CACHE_DIR to enable.
    cache_dir: null
    parallel: true
    parallel_min_sites: 50
    n_workers: null
  features:
    k_values: [3]
